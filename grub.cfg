insmod efi_gop
insmod all_video
insmod gfxterm
terminal_output gfxterm
set gfxpayload=keep

# The proven 32-bit kernel is the default until the 64-bit one is confirmed good on your hardware.
# 10 s so there is time to pick the other entry.
set timeout=10
set default=0

menuentry "VesperOS 4 Nebula (0.10) - i686 32-bit (proven, default)" {
    multiboot2 /boot/vesperos4-i686.bin
    boot
}

menuentry "VesperOS 4 Nebula (0.10) - x86_64 64-bit (testing)" {
    multiboot2 /boot/vesperos4-x86_64.bin
    boot
}
